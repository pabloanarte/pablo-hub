<!doctype html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PABLO</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icona-180.png"><link rel="icon" href="/icona-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PABLO"><meta name="theme-color" content="#f6f5f2">
<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--ink:#141414;--ink2:#3a3936;--on:#141414;--onT:#fff;--hov:rgba(20,20,20,.045);--bd:#e8e6e1;--soft:#f1efea;--mut:#76736c;--side:232px;--sh:0 1px 2px rgba(20,20,20,.04),0 0 0 1px rgba(20,20,20,.05)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--card);color:var(--ink);font-family:Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;font-size:15px}
button{font-family:inherit;color:inherit}a{color:inherit}
/* --- estructura: cabecera, contenido, menú lateral derecho --- */
.app{display:grid;grid-template-columns:1fr var(--side);grid-template-rows:56px 1fr;min-height:100vh}
.hdr{grid-column:1/-1;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:0 24px;padding-top:env(safe-area-inset-top,0px);height:calc(56px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--bd)}
.logo{font-size:20px;letter-spacing:4px;font-weight:700;cursor:pointer}
#hdate{color:var(--mut);font-size:13px}
.sp{flex:1}
.hdr .q{max-width:320px;margin:0;background:var(--soft);border-color:transparent;padding:8px 12px;font-size:14px}
.mb{display:none;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer}
.main{min-width:0;padding:24px 32px 60px}
.side{position:sticky;top:56px;height:calc(100vh - 56px);border-left:1px solid var(--bd);background:#fafafa;padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer;text-align:left}
.side button:hover{background:#efeff4}.side button.on{background:#000;color:#fff}
.side svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .n{margin-left:auto;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:1px 8px;min-width:24px;text-align:center}
.side button.on .n{background:#222;border-color:#222;color:#fff}.side .n.al{background:#d70015;border-color:#d70015;color:#fff}
.side hr{border:0;border-top:1px solid var(--bd);margin:10px 4px}.side .out{color:var(--mut);font-size:13px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.head h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.5px}.head p{margin:0 0 4px;color:var(--mut);font-size:14px}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.main{padding:16px 16px 60px}.mb{display:block}.hdr{padding:0 16px}.hdr .q{display:none}
 .side{position:fixed;top:0;left:0;right:auto;height:100vh;width:280px;z-index:30;transform:translateX(-100%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
 body.menu .side{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.12);background:var(--card)}body.menu::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:29}
}
/* --- componentes --- */
h2{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin:24px 0 8px;font-weight:600}h2 span{color:var(--ink)}
.seg,.ls,.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.seg{margin:10px 0}
.bar{flex-wrap:nowrap;margin:0 0 14px}.bar input{max-width:420px;margin:0}
.t{border:0;background:var(--soft);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.t.on{background:#000;color:#fff}
.tabs,#nav{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:0 0 18px;overflow-x:auto;flex-wrap:nowrap}
.tabs .t,#nav .t{background:none;border-radius:0;padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mut);font-size:15px}
.tabs .t.on,#nav .t.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}.tabs .t small{color:var(--mut);margin-left:4px}
.b{border:0;background:#000;color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.b2{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.del{border:0;background:none;color:#ff3b30;font-size:14px;margin-top:22px;cursor:pointer;padding:8px 0}
input,select,textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink);margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid #000;outline-offset:-1px}
input.big{font-size:24px;font-weight:700;border:0;padding:6px 0;outline:0;caret-color:#000;text-indent:0}textarea{resize:vertical;line-height:1.45}
label{display:block;font-size:12px;color:var(--mut);margin:16px 0 2px}
small{color:var(--mut);font-size:12px}.em{color:var(--mut);font-size:14px;margin:18px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ln{font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:4px 10px;color:var(--ink);text-decoration:none;white-space:nowrap;background:var(--card)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 0}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.st div{background:var(--soft);border-radius:14px;padding:16px 10px;text-align:center}.st b{display:block;font-size:28px}.st small{font-size:12px}
.tcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tc{border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer}.tc.on{border:2px solid var(--ink);padding:11px}.tc b{display:block;font-size:13px;line-height:1.3}.tc span{display:block;font-size:24px;font-weight:700;line-height:1.1;margin:6px 0 4px}.tc span small{display:inline;font-size:14px;font-weight:400;margin-left:2px}.tc>small{display:block;line-height:1.4}
/* filas (contactos, tareas) */
.r{display:flex;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.r:hover{background:#fafafa}.g{flex:1;min-width:0}.g b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{border-bottom:1px solid var(--bd);padding:8px 0;font-size:14px}pre{white-space:pre-wrap;font-family:inherit;font-size:14px;margin:8px 0}
/* listas en tarjetas */
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.hl.hlc{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.pcar{cursor:pointer;min-width:0}.pcim{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;transition:box-shadow .15s}.pcim img{width:100%;height:100%;object-fit:cover;display:block}.pcim span{padding:16px;text-align:center;font-size:17px;font-weight:700;line-height:1.25;color:#8e8e93;word-break:break-word}.pcar:hover .pcim{box-shadow:0 4px 14px rgba(0,0,0,.1)}.pcar .g{padding:8px 2px 0}.pcar .g b{display:flex;align-items:center;gap:7px;font-size:14px;line-height:1.3}.pcar .g b .dot{flex:none;margin:0}.pcar .g small{display:block;margin-top:2px;line-height:1.35}
@media(max-width:600px){.hl.hlc{grid-template-columns:repeat(2,1fr);gap:14px}}
.vgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:6px}.vgr>.em{grid-column:1/-1}
.vcar{cursor:pointer;min-width:0}.vcim{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#1c1c1e;border:1px solid var(--bd)}.vcim img{width:100%;height:100%;object-fit:cover;display:block}.vcim .vpl{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:.85;transition:opacity .15s}.vcar:hover .vpl{opacity:1}.vcim i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-style:normal;font-size:11px;font-weight:600;padding:2px 5px;border-radius:4px}
.vcar .g{padding:8px 2px 0}.vcar .g b{display:block;font-size:14px;line-height:1.3;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.vcar .g small{display:block;margin-top:2px}.vcar .g p{margin:5px 0 0;font-size:13px;line-height:1.4;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;white-space:pre-line}
.dvp{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#1c1c1e;cursor:pointer;margin:4px 0 6px}.dvp img{width:100%;height:100%;object-fit:cover;display:block}.dvp>span{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}.dvp.dvf{cursor:default}.dvp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dhor{display:inline-flex;align-items:center;gap:4px;color:#8e8e93}.dses.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.dpdf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.dpdf .chip a{color:var(--ink);text-decoration:none;font-weight:600}.dpdf .chip a:hover{text-decoration:underline}
.dvis{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.dvs{position:relative;width:150px;cursor:pointer}.dvs img,.dvs .dvph{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#1c1c1e}.dvs small{display:block;margin-top:3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.dvs .x{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.9);border-radius:50%}
@media(max-width:600px){input.big{font-size:20px}.dvq{max-width:none!important;flex-basis:100%!important}.vgr{grid-template-columns:1fr 1fr;gap:14px}.dvs,.dvs img,.dvs .dvph{width:120px}}
.arr{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:#aeaeb2;font-size:18px;padding:6px 8px 6px 0;line-height:1}.arr:hover{color:var(--ink)}.r.arrs{position:relative;z-index:5;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.15);cursor:grabbing}.r.dst{box-shadow:inset 0 3px 0 var(--ink)}.r.dsb{box-shadow:inset 0 -3px 0 var(--ink)}
.bbar{display:none}
.fab{position:fixed;right:28px;bottom:28px;width:54px;height:54px;border-radius:50%;border:0;background:#000;color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:25;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.fab:hover{transform:scale(1.05)}.qadd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qadd .b2{padding:16px 8px;font-size:15px}
.ptabs{margin-bottom:14px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.ptabs::-webkit-scrollbar{display:none}.ptabs .t{white-space:nowrap}
#subnav .seg{flex-wrap:wrap}
@media(max-width:900px){
 .bbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:26;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 .bbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;color:#8e8e93;padding:4px 0;cursor:pointer;font-family:inherit}
 .bbar button.on{color:var(--ink);font-weight:600}.bbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))!important}
 .fab{right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
 .mb{display:none!important}
}
@media(max-width:600px){.qadd{grid-template-columns:repeat(2,1fr)}}
.prcap{display:flex;gap:24px;align-items:flex-start}.prpos{width:170px;flex:none;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer}.prpos img{width:100%;height:100%;object-fit:cover;display:block}.prpos span{padding:12px;text-align:center;font-weight:700;color:#8e8e93}
.prlog{font-size:18px;line-height:1.45;margin:0;max-width:720px}.prs .pn{font-size:34px;font-weight:700;line-height:1.1}.prs:hover{border-color:#000}.dash .card{margin-top:0}
@media(max-width:600px){.prcap{gap:14px}.prpos{width:110px}.prlog{font-size:16px}}
.hl h2{grid-column:1/-1;margin:12px 0 0}.hl>.em{grid-column:1/-1}
.hl .r{border:1px solid var(--bd);border-radius:14px;padding:14px 16px;align-items:flex-start;min-height:74px;background:var(--card);transition:box-shadow .15s,border-color .15s}
.hl .r:hover{border-color:#c7c7cc;box-shadow:0 4px 14px rgba(0,0,0,.06);background:var(--card)}.hl .r .dot{margin-top:5px}
.hl .r small{display:block;margin-top:4px;line-height:1.4;white-space:normal}
/* panel de edición (lateral en ordenador, pantalla completa en móvil) */
#sh,#hsh{position:fixed;inset:0;background:rgba(0,0,0,.18);display:flex;justify-content:flex-end;z-index:40}
.sheet{background:var(--card);width:min(580px,100%);height:100vh;height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 24px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgba(0,0,0,.12);animation:entra .2s ease-out}
@keyframes entra{from{transform:translateX(40px);opacity:.4}}
.top2,.sheet .top{display:flex;justify-content:flex-end;position:sticky;top:-16px;background:var(--card);padding:8px 0;z-index:1}
@media(max-width:600px){.sheet{padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
 .sheet .sfoot{position:sticky;bottom:calc(-28px - env(safe-area-inset-bottom,0px));background:var(--card);z-index:2;margin-left:-16px;margin-right:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}}
body:has(#sh:not([hidden])),body:has(#hsh:not([hidden])){overflow:hidden}
#sh,#hsh{overscroll-behavior:contain}
#toast,#htoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;white-space:nowrap}
#lock{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}#lock input{max-width:260px;text-align:center}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;margin:4px 0}.chip button{border:0;background:none;font-size:16px;cursor:pointer;color:var(--mut)}
.ck{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.ck input{width:auto;margin:0}
.r input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--ink);cursor:pointer}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal>small{text-align:center;padding-bottom:4px}
.cd{min-height:110px;border:1px solid var(--bd);border-radius:10px;padding:6px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px}.cd:hover{background:var(--hov)}.cd b{font-size:12px;font-weight:400}
.cd.hoy{border:2px solid var(--ink);padding:5px}.cd.hoy b{font-weight:700}
.cd span{display:block;color:#fff;font-size:11px;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.cd{min-height:58px}.cd span{font-size:0;height:6px;padding:0}}
/* inicio y paneles */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.card{border:1px solid var(--bd);border-radius:16px;padding:16px 18px;background:var(--card);min-width:0}
.card.w2{grid-column:span 2}@media(max-width:800px){.card.w2{grid-column:auto}}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px}.card h3 a{margin-left:auto;font-weight:400;font-size:13px;color:var(--mut);cursor:pointer;text-decoration:none}.card h3 a:hover{color:var(--ink)}
.card .st{grid-template-columns:repeat(2,1fr)!important;gap:8px}.card .st div{padding:10px}.card .r{padding:9px 0}.card .r:hover{background:none}.card .r:last-child{border:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi div{background:var(--soft);border-radius:14px;padding:14px 16px;cursor:pointer}.kpi b{display:block;font-size:30px;line-height:1.1}.kpi small{font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:24px;align-items:start}@media(max-width:1000px){.split{grid-template-columns:1fr}}
.pub{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:20px;background:#000;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;max-width:760px}
.form{max-width:760px}
/* decks */
.dkl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}.dkcth{height:200px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:10px;overflow:hidden}.dkc{cursor:pointer;border:1px solid var(--bd);border-radius:14px;padding:5px;background:var(--card)}.dkc:hover{border-color:#c7c7cc;box-shadow:0 4px 14px rgba(0,0,0,.06)}.dkc .dkw{border-radius:10px}.dkc .g b{white-space:normal}
.dkcols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.dkmain{min-width:0}#dkprev{width:100%;display:flex;justify-content:center}#dkprev .dkw{border-radius:10px;box-shadow:0 2px 20px rgba(0,0,0,.08);outline:1px solid var(--bd)}
.dknav{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0;font-size:14px;color:var(--mut)}
.dkth{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;align-items:flex-start}
.dkt{position:relative;border-radius:8px;outline:1px solid var(--bd);cursor:pointer;overflow:hidden;flex:none}.dkt.on{outline:3px solid var(--ink)}.dkt.amg{opacity:.35}.dkt>span{position:absolute;right:6px;bottom:4px;z-index:5;font-size:11px;background:rgba(255,255,255,.92);border-radius:6px;padding:1px 6px;color:var(--ink)}
.dkadd{flex:none;align-self:stretch}
.dkpan{border:1px solid var(--bd);border-radius:14px;padding:4px 16px 16px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:70px}
.dkst{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.dkst button{overflow:hidden}.dkst button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px}.dkst button.on{outline:3px solid var(--ink);border-color:var(--ink)}.dkst .dkw{border-radius:6px}
.dkst.sm{grid-template-columns:repeat(2,1fr)}
